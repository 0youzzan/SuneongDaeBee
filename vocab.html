<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어휘 학습</title>
<link rel="stylesheet" href="css/style.css">
<style>:root{--page-accent:var(--vocab);}</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">어휘 학습</div>
    <nav>
      <a href="index.html">홈</a>
      <a href="quiz.html">어휘 테스트</a>
      <a href="csat.html">답안지 암기</a>
    </nav>
  </div>

  <div class="data-box">
    <div class="status" id="data-status">단어를 불러오는 중이에요…</div>
  </div>

  <div class="timer-select" id="mode-toggle">
    <button class="timer-opt active" data-mode="kana">히라가나로 학습</button>
    <button class="timer-opt" data-mode="kanji">한자로 학습</button>
  </div>
  <div class="status" id="mode-note" style="margin-bottom:20px;"></div>

  <div id="memorize-empty" class="center" style="color:var(--ink-soft); padding:40px 0;">
    단어를 불러오면 카드로 외울 수 있어요.
  </div>
  <div id="memorize-content" class="hidden">
    <div class="flashcard-wrap">
      <div class="deck-progress" id="deck-progress">1 / 10</div>
      <div class="flashcard" id="flashcard">
        <div class="face-label" id="face-label">일본어</div>
        <div class="word" id="card-word">言葉</div>
        <div class="sub" id="card-sub"></div>
        <div class="hint">카드를 클릭하면 뒤집혀요</div>
      </div>
      <div class="btn-row">
        <button class="btn" id="prev-btn">이전</button>
        <button class="btn" id="shuffle-btn">섞기</button>
        <button class="btn" id="next-btn">다음</button>
      </div>
    </div>
  </div>

</div>

<script src="js/csv-parser.js"></script>
<script src="js/vocab-data.js"></script>
<script src="js/vocab.js"></script>
</body>
</html>
