<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어휘 테스트</title>
<link rel="stylesheet" href="css/style.css">
<style>:root{--page-accent:var(--vocab);}</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">어휘 테스트</div>
    <nav>
      <a href="index.html">홈</a>
      <a href="vocab.html">어휘 학습</a>
      <a href="csat.html">답안지 암기</a>
    </nav>
  </div>

  <div class="data-box">
    <div class="status" id="data-status">단어를 불러오는 중이에요…</div>
  </div>

  <div id="quiz-setup">

    <!-- 문제 유형 -->
    <p style="font-weight:600; color:var(--ink-soft); margin-bottom:8px;">문제 유형</p>
    <div class="timer-select" id="type-toggle">
      <button class="timer-opt active" data-type="objective">객관식</button>
      <button class="timer-opt" data-type="subjective">주관식</button>
    </div>

    <!-- 표시 방식 (객관식) -->
    <div id="objective-mode-section">
      <p style="font-weight:600; color:var(--ink-soft); margin-bottom:8px;">표시 방식</p>
      <div class="timer-select" id="display-mode-toggle">
        <button class="timer-opt active" data-mode="all">모두</button>
        <button class="timer-opt" data-mode="kana">히라가나만</button>
        <button class="timer-opt" data-mode="kanji">한자만</button>
      </div>
    </div>

    <!-- 입력 방식 (주관식) -->
    <div id="subjective-mode-section" class="hidden">
      <p style="font-weight:600; color:var(--ink-soft); margin-bottom:8px;">입력 방식</p>
      <div class="timer-select" id="input-mode-toggle">
        <button class="timer-opt active" data-mode="kana">히라가나로 입력</button>
        <button class="timer-opt" data-mode="kanji">한자로 입력</button>
      </div>
      <div class="status" style="margin-bottom:10px;" id="subjective-hint">
        로마자로 타이핑하면 자동으로 히라가나로 바뀌어요 (예: tabe → たべ). 한자는 기기에 일본어 키보드가 있어야 입력할 수 있어요.
      </div>
    </div>

    <div class="status" id="mode-note" style="margin-bottom:20px;"></div>

    <!-- 범위 -->
    <p style="font-weight:600; color:var(--ink-soft); margin-bottom:8px;">범위</p>
    <div class="timer-select" id="scope-toggle">
      <button class="timer-opt active" data-scope="all">전체</button>
      <button class="timer-opt" data-scope="classify">분류학습</button>
      <button class="timer-opt" data-scope="daily">일일학습</button>
    </div>

    <div id="classify-scope-picker" class="hidden" style="margin-top:14px;">
      <p class="status">문법(품사)을 선택하세요.</p>
      <div class="picker-grid" id="classify-scope-buttons"></div>
    </div>
    <div id="daily-scope-picker" class="hidden" style="margin-top:14px;">
      <p class="status">단원을 선택하세요.</p>
      <div class="picker-grid" id="daily-scope-buttons"></div>
    </div>

    <p style="color:var(--ink-soft); margin-top:20px;">선택한 범위 <strong id="quiz-word-count">0</strong>개 중에서 문제를 냅니다.</p>
    <button class="btn primary" id="start-quiz-btn">시험 시작</button>
  </div>

  <div id="quiz-content" class="hidden"></div>

</div>

<script src="js/csv-parser.js"></script>
<script src="js/vocab-data.js"></script>
<script src="https://unpkg.com/wanakana@5.3.1/wanakana.min.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
