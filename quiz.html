<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어휘 테스트</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--page-accent:var(--vocab);}
.picker-btn.active{border-color:var(--vocab);background:var(--vocab-soft);font-weight:600;}
.timer-opt:disabled{opacity:0.4;cursor:not-allowed;}
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">어휘 테스트</div>
    <nav>
      <a href="index.html">홈</a>
      <a href="vocab.html">어휘 학습</a>
      <a href="csat.html">답안지 암기</a>
    </nav>
  </div>

  <div class="data-box hidden" id="data-box">
    <div class="status" id="data-status">단어를 불러오는 중이에요…</div>
  </div>

  <div id="quiz-setup">

    <!-- 문제 유형 -->
    <p style="font-weight:600; color:var(--ink-soft); margin-bottom:8px;">문제 유형</p>
    <div class="timer-select" id="type-toggle">
      <button class="timer-opt active" data-type="objective">객관식</button>
      <button class="timer-opt" data-type="subjective">주관식</button>
    </div>

    <!-- 출제 방향 -->
    <p style="font-weight:600; color:var(--ink-soft); margin-bottom:8px;">출제 방향</p>
    <div class="timer-select" id="direction-toggle">
      <button class="timer-opt" data-dir="meaning-kana">뜻 보고 히라가나 맞추기</button>
      <button class="timer-opt active" data-dir="kana-meaning">히라가나 보고 뜻 맞추기</button>
      <button class="timer-opt" data-dir="kanji-meaning">한자 보고 뜻 맞추기</button>
      <button class="timer-opt" data-dir="kanji-kana">한자 보고 히라가나 맞추기</button>
      <button class="timer-opt" data-dir="kana-kanji">히라가나 보고 한자 맞추기</button>
    </div>
    <div class="status" id="mode-note" style="margin-bottom:20px;"></div>

    <!-- 범위 -->
    <p style="font-weight:600; color:var(--ink-soft); margin-bottom:8px;">범위</p>
    <div class="timer-select" id="scope-toggle">
      <button class="timer-opt active" data-scope="all">전체</button>
      <button class="timer-opt" data-scope="partial">부분</button>
      <button class="timer-opt" data-scope="classify">분류학습</button>
      <button class="timer-opt" data-scope="daily">일일학습</button>
    </div>

    <div id="partial-scope-picker" class="hidden" style="margin-top:14px;">
      <p class="status">원하는 문제 개수를 입력하세요.</p>
      <input type="number" id="partial-count-input" class="btn" style="width:120px;" min="1" value="20">
    </div>
    <div id="classify-scope-picker" class="hidden" style="margin-top:14px;">
      <p class="status">문법(품사)을 선택하세요.</p>
      <div class="picker-grid" id="classify-scope-buttons"></div>
    </div>
    <div id="daily-scope-picker" class="hidden" style="margin-top:14px;">
      <p class="status">단원을 선택하세요.</p>
      <div class="picker-grid" id="daily-scope-buttons"></div>
    </div>

    <p style="color:var(--ink-soft); margin-top:20px;">선택한 범위 <strong id="quiz-word-count">0</strong>개 중에서 문제를 냅니다.</p>
    <button class="btn primary" id="start-quiz-btn">시험 시작</button>
  </div>

  <div class="btn-row hidden" id="quiz-active-bar" style="justify-content:flex-end; margin-bottom:10px;">
    <button class="btn" id="exit-quiz-btn">종료하기</button>
  </div>
  <div id="quiz-content" class="hidden"></div>

</div>

<script src="js/csv-parser.js"></script>
<script src="js/vocab-data.js"></script>
<script src="https://unpkg.com/wanakana@5.3.1/wanakana.min.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
